{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div style="font-size: 3rem;">⛵</div>
      <h4 class="page-title">Choose New Password</h4>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" name="password" class="form-control form-control-lg"
                   autofocus autocomplete="new-password" minlength="6" required>
            <div class="form-text">At least 6 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control form-control-lg"
                   autocomplete="new-password" required>
          </div>
          <button class="btn btn-navy btn-lg w-100" type="submit">
            <i class="bi bi-check-lg me-1"></i> Set New Password
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}" class="text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to sign in
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
