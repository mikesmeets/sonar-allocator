{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <div style="font-size: 3rem;">⛵</div>
      <h4 class="page-title">Reset Password</h4>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <p class="text-muted small mb-3">
          Enter your email address and we'll send you a link to reset your password.
        </p>
        <form method="post">
          <div class="mb-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control form-control-lg"
                   autofocus autocomplete="email" required>
          </div>
          <button class="btn btn-navy btn-lg w-100" type="submit">
            <i class="bi bi-envelope me-1"></i> Send Reset Link
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('login') }}" class="text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to sign in
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
